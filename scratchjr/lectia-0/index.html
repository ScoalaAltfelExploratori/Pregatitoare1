<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163e35"><title>Lecția 0 · Laboratorul de cod</title><link rel="stylesheet" href="style.css?v=coding-2"><script src="lesson.js?v=clear-1" defer></script><script src="engine.js?v=coding-3" defer></script><script src="app.js?v=clear-1" defer></script></head>
<body><main id="presentation" aria-label="Lecția 0, atelier de cod">
<header><div><p class="eyebrow" id="topic"></p><h1 id="title"></h1></div><div class="tools"><button id="contents" aria-haspopup="dialog">☷ Cuprins</button><button id="fullscreen" aria-label="Ecran complet">⛶</button></div></header>
<div class="preview"><section id="stage" aria-label="Scena programului"></section><aside class="mission"><p class="eyebrow">Ținta noastră</p><h2 id="goal"></h2><p id="equation"></p><label for="prediction" id="question"></label><select id="prediction" aria-label="Predicția noastră"></select><p id="intro-message"></p></aside></div>
<div id="editor-bar"><label>Personaj <select id="actor" aria-label="Personajul al cărui cod îl edităm"></select></label><select id="script" aria-label="Programul personajului"></select><button id="add-script" title="Adaugă un program" aria-label="Adaugă un program">＋</button><label class="hat">Când <select id="trigger" aria-label="Cum pornește programul"><option value="flag">⚑ Steag verde</option><option value="tap">☝ La apăsare</option><option value="message">✉ La mesaj</option><option value="bump">● La atingere</option></select><select id="channel" aria-label="Culoarea mesajului primit"><option value="orange">Portocaliu</option><option value="blue">Albastru</option></select></label><button id="undo">↶ Înapoi</button><button id="clear">Golește</button></div>
<section id="coding-area" aria-label="Programul editabil"><div id="workspace"></div><div id="block-tools"><span id="selection-label">Trage un bloc aici ↓</span><button id="move-left" aria-label="Mută blocul la stânga">←</button><button id="move-right" aria-label="Mută blocul la dreapta">→</button><button id="delete" class="trash" aria-label="Șterge blocul selectat">⌫ Șterge</button></div></section>
<section id="palette-area" aria-label="Paleta de blocuri"><p id="palette-label">Blocurile tale <small>Trage sau apasă</small></p><div id="palette"></div></section>
<p id="feedback" role="status" aria-live="polite"></p>
<footer><button id="previous" aria-label="Activitatea anterioară">←</button><span id="progress"></span><button id="sound" aria-pressed="true" aria-label="Sunet activ">♫</button><button id="hint">Indiciu</button><button id="reset">↻ Reia scena</button><button id="stop">■ Stop</button><button id="run" class="primary">⚑ Rulează codul</button><button id="next">Mai departe →</button></footer>
</main>
<dialog id="menu" aria-labelledby="menu-title"><div class="dialog-head"><h2 id="menu-title">Atelierul nostru de cod</h2><button id="close-menu" aria-label="Închide cuprinsul">✕</button></div><p>50 de minute · 10 activități și 2 rezerve</p><div id="scene-list"></div><details id="teacher"><summary>Pentru profesor</summary><p id="teacher-notes"></p><button id="example">Încarcă exemplul</button><button id="restart">Reia activitatea</button><button id="skip">Următoarea activitate</button></details><nav><a href="ghid.html">Ghidul profesorului</a><a href="../index.html">Toate lecțiile</a><a href="../../index.html">Meniul siteului</a></nav></dialog>
